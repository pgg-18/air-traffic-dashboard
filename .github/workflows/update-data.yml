name: Update air traffic data

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the fetch
        run: python -c "from pipeline import check_and_update; check_and_update()"

      - name: Commit updated database if it changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add airtraffic.db
          if git diff --staged --quiet; then
            echo "No new data — nothing to commit."
          else
            git commit -m "Auto-update air traffic data"
            git push
          fi
